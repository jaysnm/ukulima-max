# `db` has no profile, so `docker compose up` starts only Postgres — the
# default is native local dev (see Makefile: `make db-up` + `backend-run` /
# `frontend-run`). backend/frontend/nginx are behind the "web" profile and
# only start with `docker compose --profile web up` (or `make up`).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: ukulima-pgdb
    platform: ${DOCKER_PLATFORM:-}
    environment:
      POSTGRES_DB: ukulima
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Exposed so the backend/frontend can also be run natively against this
      # same database (see `make db-up` / `make backend-run` in the Makefile).
      - "${PG_HOST_IP:-127.0.0.1}:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ${PG_DATA_DIR:-${DATA_DIR:-./data}/pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    container_name: ukulima_backed
    profiles: ["web"]
    platform: ${DOCKER_PLATFORM:-}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ukulima
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DEBUG: ${DEBUG:-False}
      SECURE_SSL_REDIRECT: "False"
    volumes:
      - ${MEDIA_DIR:-${DATA_DIR:-./data}/media}:/app/media
      - ${STATIC_DIR:-${DATA_DIR:-./data}/static}:/app/static
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build: ./frontend
    container_name: ukulima-frontend
    restart: unless-stopped
    profiles: ["web"]
    platform: ${DOCKER_PLATFORM:-}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: ukulima-proxy
    profiles: ["web"]
    platform: ${DOCKER_PLATFORM:-}
    ports:
      - "${HOST_IP:-127.0.01}:${HTTP_PORT:-8070}:80"
      - "${HOST_IP:-127.0.01}:${HTTPS_PORT:-4370}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MEDIA_DIR:-${DATA_DIR:-./data}/media}:/media:ro
      - ${STATIC_DIR:-${DATA_DIR:-./data}/static}:/static:ro
    depends_on:
      - backend
      - frontend
